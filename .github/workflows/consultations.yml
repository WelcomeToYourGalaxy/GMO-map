name: Consultations feed

# Split out of facilities.yml for one reason: everything else in that workflow
# is a register that changes a few times a year, and this is the one thing on
# the map that EXPIRES. A comment window is worthless the day after it closes,
# and the map refuses to show this list at all once the file is three weeks
# old - so a monthly harvest can leave it blank for a fortnight while the
# facility registers it was riding along with have nothing new to say.
#
# Daily, and it touches exactly one file.

on:
  schedule:
    - cron: '23 5 * * *'          # daily, early
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: consultations
  cancel-in-progress: false

jobs:
  consultations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Selftest FIRST, and it is allowed to fail the step. Same reasoning as
      # the geolocator in facilities.yml: a filter that has silently loosened,
      # or a date parser that has stopped understanding the Excel serials the
      # WTO file is full of, is worse than one that does not run - it writes a
      # plausible file full of wrong deadlines. This needs no network.
      - name: Selftest the parsers
        run: python3 harvest/consultations.py --selftest

      - name: Harvest open consultations
        run: |
          set +e
          # 12m was too tight once the WTO notification workbook became a
          # source: it is every SPS and TBT notification filed since 1995 in
          # one file, and the download dominates the run.
          timeout 20m python3 harvest/consultations.py
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "!! consultations exited $rc - leaving the previous file in place"
          fi
          set -e

          # A failed run must not blank the file. The harvester now refuses to
          # write at all when no source could be fetched, and exits non-zero,
          # so there are two guards rather than one: it writes nothing, and
          # committing nothing is correct. A stale list is caught by the map's
          # own three-week freshness check, but an EMPTY list would be read as
          # "no consultations are open anywhere", which is a much worse lie.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A --ignore-errors harvest/consultations.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "consultations: refresh $(date -u +%Y-%m-%d)"
            # Same reasoning as the other workflows: this is a generated file,
            # so on a collision the newest run is simply right. reset --mixed
            # moves the branch pointer and leaves the file on disk.
            for i in 1 2 3; do
              git push && exit 0
              echo "push rejected; rebuilding on top of origin (attempt $i)"
              git fetch origin main || true
              git reset --mixed origin/main
              git add -A --ignore-errors harvest/consultations.json
              git commit -m "consultations: refresh $(date -u +%Y-%m-%d)" || true
            done
            echo "could not push after 3 attempts"
            exit 1
          fi
