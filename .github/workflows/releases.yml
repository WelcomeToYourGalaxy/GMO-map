name: Harvest APHIS releases

on:
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-main
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Harvest and commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Same pattern as the wire: these files are regenerated whole, so on a
          # rejected push we reset to the remote and re-harvest rather than
          # trying to rebase a wholesale rewrite.
          for i in 1 2 3; do
            python3 harvest/cfia_approvals.py
            python3 harvest/aphis_releases.py
            python3 harvest/build_overlays.py
            git add projects.json harvest/cfia_records.json overlays/trials.geojson overlays/regime.geojson
            git diff --staged --quiet && { echo "no change"; exit 0; }
            git commit -m "releases: refresh $(date -u +%Y-%m-%d)"
            git push && exit 0
            echo "push rejected (attempt $i) - resetting to origin/main and re-harvesting"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "push failed after 3 attempts"; exit 1
