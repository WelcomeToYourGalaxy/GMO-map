name: Harvest APHIS releases

on:
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-main
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Harvest and commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Same pattern as the wire: these files are regenerated whole, so on a
          # rejected push we reset to the remote and re-harvest rather than
          # trying to rebase a wholesale rewrite.
          # Each harvester is allowed to fail without taking the step down. This
          # step runs under `bash -e`, so an unhandled non-zero status from the
          # first script skips every one after it — which is exactly what a CFIA
          # timeout did, and APHIS never ran at all. A source being unreachable
          # is a normal condition, not a build failure.
          for i in 1 2 3; do
            python3 harvest/cfia_approvals.py       || echo "!! cfia harvester failed - continuing"
            python3 harvest/build_industry_points.py || echo "!! industry points failed - continuing"
            python3 harvest/contamination_register.py || echo "!! contamination register failed - continuing"
            python3 harvest/aphis_releases.py       || echo "!! aphis harvester failed - continuing"
            python3 harvest/build_overlays.py       || echo "!! overlay builder failed - continuing"
            # --ignore-errors so a file a failed harvester never wrote does not
            # abort the step under bash -e on the first run.
            git add --ignore-errors projects.json harvest/cfia_records.json \
                    harvest/industry_points.json harvest/register_records.json overlays/trials.geojson \
                    overlays/regime.geojson 2>/dev/null || true
            git diff --staged --quiet && { echo "no change"; exit 0; }
            git commit -m "releases: refresh $(date -u +%Y-%m-%d)"
            git push && exit 0
            echo "push rejected (attempt $i) - resetting to origin/main and re-harvesting"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "push failed after 3 attempts"; exit 1
