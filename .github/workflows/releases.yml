name: Harvest APHIS releases

on:
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Own group - see the note in wire.yml. Sharing one group meant a queued run
# cancelled the waiting one; the reset-and-re-harvest retry below already handles
# push collisions.
concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    # A ceiling on the whole job. Five harvesters were added without one and the
    # run went past two hours: nothing here is worth an unbounded wait, and a
    # job that never finishes also never commits what the earlier steps did get.
    timeout-minutes: 86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Harvest and commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Same pattern as the wire: these files are regenerated whole, so on a
          # rejected push we reset to the remote and re-harvest rather than
          # trying to rebase a wholesale rewrite.
          # Each harvester is allowed to fail without taking the step down. This
          # step runs under `bash -e`, so an unhandled non-zero status from the
          # first script skips every one after it — which is exactly what a CFIA
          # timeout did, and APHIS never ran at all. A source being unreachable
          # is a normal condition, not a build failure.
          for i in 1 2 3; do
            timeout 5m python3 harvest/cfia_approvals.py || echo "!! cfia harvester failed - continuing"
            timeout 2m python3 harvest/build_industry_points.py || echo "!! industry points failed - continuing"
            timeout 4m python3 harvest/contamination_register.py || echo "!! contamination register failed - continuing"
            timeout 5m python3 harvest/animal_facilities.py || echo "!! animal facilities failed - continuing"
            timeout 12m python3 harvest/ogtr_trials.py || echo "!! ogtr trials failed - continuing"
            timeout 8m python3 harvest/gmofree_zones.py     || echo "!! gmo-free zones failed - continuing"
            timeout 8m python3 harvest/fas_biotech.py       || echo "!! fas biotech failed - continuing"
            timeout 18m python3 harvest/bch_decisions.py    || echo "!! bch decisions failed - continuing"
            timeout 8m python3 harvest/clinical_sponsors.py || echo "!! clinical sponsors failed - continuing"
            timeout 8m python3 harvest/aphis_releases.py || echo "!! aphis harvester failed - continuing"
            timeout 2m python3 harvest/build_overlays.py || echo "!! overlay builder failed - continuing"
            # --ignore-errors so a file a failed harvester never wrote does not
            # abort the step under bash -e on the first run.
            # `git add a.json b.json` ABORTS AND STAGES NOTHING if any one pathspec
            # matches no file, and --ignore-errors does not cover that case. Five of
            # these files do not exist until their harvester first succeeds, so every
            # run so far staged nothing and reported "no change" - after writing
            # 24,241 records. Add them one at a time, skipping what is absent.
            for f in projects.json projects.json.gz wire.json \
                     harvest/cfia_records.json harvest/industry_points.json \
                     harvest/register_records.json harvest/animal_facilities.json \
                     harvest/ogtr_trials.json \
                     harvest/bch_decisions.json harvest/gmofree_zones.json harvest/fas_biotech.json \
                     harvest/clinical_sponsors.json \
                     overlays/trials.geojson overlays/regime.geojson \
                     overlays/incidents.geojson; do
              [ -e "$f" ] && git add "$f"
            done
            git diff --staged --quiet && { echo "no change"; exit 0; }
            git commit -m "releases: refresh $(date -u +%Y-%m-%d)"
            git push && exit 0
            echo "push rejected (attempt $i) - resetting to origin/main and re-harvesting"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "push failed after 3 attempts"; exit 1
