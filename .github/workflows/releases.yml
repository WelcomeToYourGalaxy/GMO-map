name: Harvest APHIS releases

on:
  schedule:
    - cron: '43 5 * * 1'      # weekly, Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harvest release authorisations
        run: python3 harvest/aphis_releases.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git diff --staged --quiet || git commit -m "releases: refresh $(date -u +%Y-%m-%d)"
          # Both workflows commit to main and can finish at the same time, so a
          # bare push loses the race. Rebase onto whatever landed first, retry.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $i) - rebasing onto origin/main"
            git pull --rebase origin main || exit 1
          done
          echo "push failed after 3 attempts"; exit 1
