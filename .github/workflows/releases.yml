name: releases

# ---------------------------------------------------------------------------
# KEEP YOUR EXISTING `on:` BLOCK. The logs echo the steps a run executed, not
# the triggers that started it, so the schedule below is a placeholder and I do
# not know what yours says. Everything else in this file is reconstructed from
# run 88578119022 verbatim, with the three changes listed under `concurrency`
# and at the commit step.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# CHANGE 1 of 3. This group name must be identical in facilities.yml. On
# 2026-08-24 facilities checked out main at 05:56, ran 55 minutes, and pushed
# at 06:52 over the top of this job's 06:33 commit - reverting eleven files and
# deleting harvest/ogtr_trials.json outright. A shared group serialises the two
# so the overlap does not start.
#
# cancel-in-progress MUST be false. True would kill a facilities run partway
# through, and that job holds a 30-minute india_nartsr step.
concurrency:
  group: gmo-map-commit
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --no-input pypdf

      # CHANGE 2 of 3. Records the moment the harvesters start. The commit step
      # stages what is newer than this and nothing else, so a file another job
      # added while this one was running is never staged - not as a change, not
      # as a deletion.
      - name: mark step start
        run: bash .github/commit_outputs.sh --stamp

      - name: harvest
        shell: bash -e {0}
        run: |
          # Each harvester is allowed to fail without taking the step down.
          # This step runs under `bash -e`, so an unhandled non-zero status
          # from the first script skips every one after it — which is exactly
          # what a CFIA timeout did, and APHIS never ran at all. A source being
          # unreachable is a normal condition, not a build failure.
          #
          # The `for i in 1 2 3` wrapper this used to sit inside is GONE. It
          # existed so that a rejected push could `git reset --hard
          # origin/main` and re-harvest from scratch — ten minutes of network
          # work to recover from a collision. commit_outputs.sh recovers with
          # `reset --mixed`, which leaves this run's output on disk to be
          # re-staged, so nothing needs harvesting twice.
          timeout 5m python3 harvest/cfia_approvals.py || echo "!! cfia harvester failed - continuing"
          timeout 2m python3 harvest/merge_industry.py || echo "!! merge_industry failed - continuing"
          python3 harvest/build_industry_points.py || echo "!! industry points failed - continuing"
          timeout 4m python3 harvest/contamination_register.py || echo "!! contamination register failed - continuing"
          # -u MATTERS HERE. This step is killed by `timeout` while the script
          # is still probing, and Python BLOCK-BUFFERS stdout when it is not a
          # terminal: the buffer is discarded on SIGTERM, so four runs produced
          # the single line "!! ogtr trials failed" and nothing else -
          # including the lines the script prints BEFORE any network call. The
          # output was never missing, it was never flushed.
          #
          # 6m is now generous. The circuit breaker skips every live request
          # after the first failure that means the host is silent, so the
          # 2026-08-24 shape of run costs seconds rather than 4m10s.
          timeout 6m python3 -u harvest/ogtr_trials.py || echo "!! ogtr trials failed - continuing"
          timeout 8m python3 harvest/gmofree_zones.py     || echo "!! gmo-free zones failed - continuing"
          timeout 8m python3 harvest/fas_biotech.py       || echo "!! fas biotech failed - continuing"
          timeout 8m python3 harvest/treaties.py || echo "!! treaties failed - continuing"
          # The organism registry must run BEFORE the decisions harvester: it
          # resolves a code-only decision title to its organism from that file,
          # and without it every such title stays unnamed.
          timeout 10m python3 harvest/bch_organisms.py   || echo "!! bch organisms failed - continuing"
          timeout 8m  python3 harvest/eu_releases.py     || echo "!! eu releases failed - continuing"
          timeout 8m  python3 harvest/latam_approvals.py || echo "!! latam approvals failed - continuing"
          timeout 10m python3 harvest/isaaa_approvals.py || echo "!! isaaa approvals failed - continuing"
          timeout 14m python3 harvest/bch_decisions.py    || echo "!! bch decisions failed - continuing"
          timeout 8m python3 harvest/clinical_sponsors.py || echo "!! clinical sponsors failed - continuing"
          # last: it reads what the facility harvesters wrote
          timeout 8m python3 harvest/aphis_releases.py || echo "!! aphis harvester failed - continuing"
          timeout 3m python3 harvest/build_regime.py || echo "!! regime overlay failed - continuing"
          timeout 2m python3 harvest/build_overlays.py || echo "!! overlay builder failed - continuing"
          # The Secretariat's own focal-point list: institution + website per
          # country, personal data stripped with an assertion in the script.
          timeout 6m python3 harvest/bch_focal_points.py || echo "!! bch focal points failed - continuing"
          # IPPC Art. VIII.2 contact points: the NPPO each country has
          # designated. Names a body; publishes no website. Runs BEFORE the
          # merge so the merge can read it in the same pass.
          #
          # --websites REMOVED. It fetched the IPPC country page for each of
          # ~180 countries looking for a Website: line the CSV omits. The route
          # was tried twice and returned nothing both times: the field is blank
          # for most countries and the pages that do carry one are rendered
          # client-side, so a fetcher sees an empty shell. It cost 20 minutes
          # of the job's budget per run to produce no rows. The flag still
          # exists in the script for anyone who wants to re-test it by hand; it
          # is not worth a scheduled slot.
          timeout 4m python3 harvest/ippc_contacts.py || echo "!! ippc contacts failed - continuing"
          # Gated merge. Never overwrites a link, never renames a row that
          # names a real body, prints every row it holds back for review.
          timeout 6m python3 harvest/merge_directory.py || echo "!! directory merge failed - continuing"

      # CHANGE 3 of 3. The explicit `for f in ...` list is gone. It was not the
      # file that deleted ogtr_trials.json - facilities' `git add -A` did that -
      # but it carried its own fault: five of its pathspecs do not exist until
      # their harvester first succeeds, and it had to name every new output by
      # hand. Staging by modification time covers new harvesters without an
      # edit, and cannot stage another job's file at all.
      - name: commit
        run: bash .github/commit_outputs.sh releases
