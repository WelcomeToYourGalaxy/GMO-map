name: Harvest wire

on:
  schedule:
    - cron: '17 */6 * * *'      # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harvest feeds
        run: python3 harvest/wire_harvest.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wire.json
          git diff --staged --quiet || git commit -m "wire: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
