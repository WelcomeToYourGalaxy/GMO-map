name: Tidy repo (one-off)

# Run this from the Actions tab: select it, press "Run workflow".
# It runs tidy_repo.py, commits the result, and then you delete both this file
# and tidy_repo.py. Nothing schedules it; it only ever runs when you press the
# button.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-main
  cancel-in-progress: false

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show what it would do
        run: python3 tidy_repo.py --dry-run

      - name: Do it
        run: python3 tidy_repo.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && { echo "nothing to change"; exit 0; }
          git commit -m "tidy: remove stray files, normalise wire language codes"
          git push
